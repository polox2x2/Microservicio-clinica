apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-config
  namespace: clinica
  labels:
    app: microservice-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-config
  template:
    metadata:
      labels:
        app: microservice-config
    spec:
      enableServiceLinks: false
      containers:
        - name: microservice-config
          image: clinica/microservice-config:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-config
  namespace: clinica
spec:
  type: ClusterIP
  selector:
    app: microservice-config
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-eureka
  namespace: clinica
  labels:
    app: microservice-eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-eureka
  template:
    metadata:
      labels:
        app: microservice-eureka
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://microservice-config:8888/actuator/health; do
                echo "Esperando microservice-config..."
                sleep 3
              done
      containers:
        - name: microservice-eureka
          image: clinica/microservice-eureka:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: clinica-config
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-eureka
  namespace: clinica
spec:
  type: LoadBalancer
  selector:
    app: microservice-eureka
  ports:
    - port: 8761
      targetPort: 8761
