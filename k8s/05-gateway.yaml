apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-gateway
  namespace: clinica
  labels:
    app: microservice-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-gateway
  template:
    metadata:
      labels:
        app: microservice-gateway
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://microservice-config:8888/actuator/health; do echo "Esperando microservice-config..."; sleep 3; done
              until wget -q -O /dev/null http://microservice-eureka:8761/actuator/health; do echo "Esperando microservice-eureka..."; sleep 3; done
      containers:
        - name: microservice-gateway
          image: polox2x2/microservice-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: clinica-config
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-gateway
  namespace: clinica
spec:
  type: LoadBalancer
  selector:
    app: microservice-gateway
  ports:
    - port: 8080
      targetPort: 8080
