apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-citas
  namespace: clinica
  labels:
    app: microservice-citas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-citas
  template:
    metadata:
      labels:
        app: microservice-citas
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          command:
            - sh
            - -c
            - |
              until nc -z mysql-db 3306; do echo "Esperando mysql-db..."; sleep 3; done
              until wget -q -O /dev/null http://microservice-config:8888/actuator/health; do echo "Esperando microservice-config..."; sleep 3; done
              until wget -q -O /dev/null http://microservice-eureka:8761/actuator/health; do echo "Esperando microservice-eureka..."; sleep 3; done
      containers:
        - name: microservice-citas
          image: polox2x2/microservice-citas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: clinica-config
            - secretRef:
                name: clinica-secret
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-citas
  namespace: clinica
spec:
  type: ClusterIP
  selector:
    app: microservice-citas
  ports:
    - port: 8081
      targetPort: 8081
---
