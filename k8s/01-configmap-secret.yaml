apiVersion: v1
kind: ConfigMap
metadata:
  name: clinica-config
  namespace: clinica
data:
  CONFIG_SERVER_URL: "http://microservice-config:8888"
  EUREKA_HOSTNAME: "microservice-eureka"
  EUREKA_URI: "http://microservice-eureka:8761/eureka/"
  CITAS_SERVICE_URL: "http://microservice-citas:8081"
  NOTIFICACIONES_SERVICE_URL: "http://microservice-notificaciones-recordatorios:8083"
  DB_MYSQL_HOST: "mysql-db"
  DB_MYSQL_PORT: "3306"
  DB_MYSQL_USER: "root"
  DB_PG_HOST: "postgres-db"
  DB_PG_PORT: "5432"
  DB_PG_USER: "postgres"
  JWT_EXPIRATION_MS: "86400000"
---
apiVersion: v1
kind: Secret
metadata:
  name: clinica-secret
  namespace: clinica
type: Opaque
stringData:
  DB_MYSQL_PASSWORD: "root"
  DB_PG_PASSWORD: "postgres"
  JWT_SECRET: "ClinicaMicroserviciosSecretKey2026SuperSeguraParaJwtHS256!"
