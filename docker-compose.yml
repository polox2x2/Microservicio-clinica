services:
  mysql-db:
    image: mysql:8.0
    container_name: clinica-mysql
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=100"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: clinica_citas
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - clinica-net

  postgres-db:
    image: postgres:17-alpine
    container_name: clinica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PG_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${DOCKER_PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clinica-net

  microservice-config:
    image: polox2x2/microservice-config:1.0
    container_name: clinica-config
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-config
    ports:
      - "8888:8888"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 320M
        reservations:
          cpus: "0.075"
          memory: 160M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clinica-net

  microservice-eureka:
    image: polox2x2/microservice-eureka:1.0
    container_name: clinica-eureka
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-eureka
    depends_on:
      microservice-config:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://microservice-config:8888
      EUREKA_HOSTNAME: microservice-eureka
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clinica-net

  microservice-citas:
    image: polox2x2/microservice-citas:1.0
    container_name: clinica-citas
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-citas
    depends_on:
      mysql-db:
        condition: service_healthy
      microservice-config:
        condition: service_healthy
      microservice-eureka:
        condition: service_healthy
    environment:
      DB_MYSQL_HOST: mysql-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: root
      DB_MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:-root}
      CONFIG_SERVER_URL: http://microservice-config:8888
      EUREKA_URI: http://microservice-eureka:8761/eureka/
      NOTIFICACIONES_SERVICE_URL: http://microservice-notificaciones-recordatorios:8083
      JWT_SECRET: ${JWT_SECRET:-ClinicaMicroserviciosSecretKey2026SuperSeguraParaJwtHS256!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - clinica-net

  microservice-ecommerce:
    image: polox2x2/microservice-ecommerce:1.0
    container_name: clinica-ecommerce
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-ecommerce
    depends_on:
      postgres-db:
        condition: service_healthy
      microservice-config:
        condition: service_healthy
      microservice-eureka:
        condition: service_healthy
    environment:
      DB_PG_HOST: postgres-db
      DB_PG_PORT: 5432
      DB_PG_USER: ${DB_PG_USER:-postgres}
      DB_PG_PASSWORD: ${DB_PG_PASSWORD:-postgres}
      CONFIG_SERVER_URL: http://microservice-config:8888
      EUREKA_URI: http://microservice-eureka:8761/eureka/
      CITAS_SERVICE_URL: http://microservice-citas:8081
      NOTIFICACIONES_SERVICE_URL: http://microservice-notificaciones-recordatorios:8083
      JWT_SECRET: ${JWT_SECRET:-ClinicaMicroserviciosSecretKey2026SuperSeguraParaJwtHS256!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - clinica-net

  microservice-notificaciones-recordatorios:
    image: polox2x2/microservice-notificaciones:1.0
    container_name: clinica-notificaciones
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-notificaciones-recordatorios
    depends_on:
      postgres-db:
        condition: service_healthy
      microservice-config:
        condition: service_healthy
      microservice-eureka:
        condition: service_healthy
    environment:
      DB_PG_HOST: postgres-db
      DB_PG_PORT: 5432
      DB_PG_USER: ${DB_PG_USER:-postgres}
      DB_PG_PASSWORD: ${DB_PG_PASSWORD:-postgres}
      CONFIG_SERVER_URL: http://microservice-config:8888
      EUREKA_URI: http://microservice-eureka:8761/eureka/
      CITAS_SERVICE_URL: http://microservice-citas:8081
      JWT_SECRET: ${JWT_SECRET:-ClinicaMicroserviciosSecretKey2026SuperSeguraParaJwtHS256!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 448M
        reservations:
          cpus: "0.125"
          memory: 224M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - clinica-net

  microservice-gateway:
    image: polox2x2/microservice-gateway:1.0
    container_name: clinica-gateway
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: microservice-gateway
    depends_on:
      microservice-config:
        condition: service_healthy
      microservice-eureka:
        condition: service_healthy
      microservice-citas:
        condition: service_healthy
      microservice-ecommerce:
        condition: service_healthy
      microservice-notificaciones-recordatorios:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://microservice-config:8888
      EUREKA_URI: http://microservice-eureka:8761/eureka/
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clinica-net

volumes:
  mysql_data:
  postgres_data:

networks:
  clinica-net:
    driver: bridge
